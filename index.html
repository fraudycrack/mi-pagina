<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: Segoe UI, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #58a6ff; margin-top: 0; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 5px; }
    button { width: 100%; padding: 10px; background: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #2ea043; }
    .hidden { display: none; }
    .error { color: #f85149; text-align: center; font-size: 0.9em; margin-top: 10px; }
    .blocked { color: #f85149; text-align: center; }
    .btn-logout { background: #da3633; margin-top: 15px; }
    .btn-logout:hover { background: #b62324; }
  </style>
</head>
<body>

  <!-- 1. Pantalla de Iniciar Sesión -->
  <div id="login-box" class="card">
    <h2>Iniciar Sesión</h2>
    <input type="text" id="username" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <p id="error-msg" class="error"></p>
  </div>

  <!-- 2. Pantalla de Bloqueo (Usuario No Pagado) -->
  <div id="blocked-box" class="card hidden">
    <h2 class="blocked">⚠️ Acceso Bloqueado</h2>
    <p style="text-align: center;">Tu suscripción ha vencido o no has realizado el pago correspondiente.</p>
    <p style="text-align: center; font-size: 0.85em; color: #8b949e;">Contacta al administrador para activar tu cuenta.</p>
    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>

  <!-- 3. Contenido Privado (Usuario Pagado) -->
  <div id="content-box" class="card hidden">
    <h2 style="color: #3fb950;">¡Bienvenido!</h2>
    <p>Este es el sistema exclusivo para usuarios con pago al día.</p>
    <ul>
      <li>Módulo de Control</li>
      <li>Datos y Estadísticas</li>
    </ul>
    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>

  <script>
    // BASE DE DATOS DE USUARIOS (true = Pagado / false = No Pagado)
    const usuarios = {
      "juan": { pass: "1234", pagado: true },
      "pedro": { pass: "1234", pagado: false },
      "admin": { pass: "admin123", pagado: true }
    };

    function login() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");

      errorMsg.innerText = "";

      if (usuarios[user] && usuarios[user].pass === pass) {
        document.getElementById("login-box").classList.add("hidden");
        
        if (usuarios[user].pagado) {
          document.getElementById("content-box").classList.remove("hidden");
        } else {
          document.getElementById("blocked-box").classList.remove("hidden");
        }
      } else {
        errorMsg.innerText = "Usuario o contraseña incorrectos";
      }
    }

    function logout() {
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("content-box").classList.add("hidden");
      document.getElementById("blocked-box").classList.add("hidden");
      document.getElementById("login-box").classList.remove("hidden");
    }
  </script>

</body>
</html>
