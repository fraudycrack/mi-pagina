<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Playlist Personal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Reproductor Nativo HTML5 */
    .native-player-container {
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    /* Visualizador Banner */
    .album-art {
      width: 100%;
      height: 160px;
      background: linear-gradient(45deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
      position: relative;
      overflow: hidden;
    }

    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 40px;
    }

    .bar {
      width: 8px;
      background: #fff;
      border-radius: 4px;
      height: 10px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .bar:nth-child(2) { animation-delay: 0.3s; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 8px; }
      100% { height: 38px; }
    }

    .track-info {
      text-align: center;
      margin: 15px 0;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      word-break: break-word;
    }

    .track-status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Botones de Selección Directa */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="player-card">
    
    <!-- Reproductor Nativo Visible -->
    <div class="native-player-container">
      <audio id="audio-player" controls preload="auto">
        <source src="01 Passion - One Thing Remains.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
      </audio>
    </div>

    <!-- Visualizador de Estado -->
    <div class="album-art" id="art-container">
      <div class="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="current-title">Passion - One Thing Remains</div>
      <div class="track-status" id="current-status">Presiona Play en el reproductor</div>
    </div>

    <!-- Botones Anterior y Siguiente -->
    <div class="controls">
      <button class="btn" id="btn-prev">⏮️ Anterior</button>
      <button class="btn" id="btn-next">Siguiente ⏭️</button>
    </div></div>

  <script>
    const tracks = [
      { name: "Passion - One Thing Remains", file: "01 Passion - One Thing Remains.mp3" },
      { name: "Casting Crowns - Just Be Held", file: "03 Casting Crowns - Just Be Held.mp3" },
      { name: "NF - Wake Up", file: "05 NF - Wake Up.mp3" },
      { name: "NF - Oh Lord", file: "07 NF - Oh Lord.mp3" },
      { name: "NF - I'll Keep On", file: "11 NF - I l Keep On.mp3" },
      { name: "NF - Can You Hold Me", file: "12 NF - Can You Hold Me.mp3" },
      { name: "Avicii - Trouble", file: "13 Avicii - Trouble.mp3" },
      { name: "NF - I Miss The Days", file: "13 NF - I Miss The Days.mp3" },
      { name: "NF - Lost In The Moment", file: "14 NF - Lost In The Moment.mp3" },
      { name: "Flame - Start Over feat. NF", file: "15 Flame - Start Over feat. NF.mp3" },
      { name: "La Fiesta", file: "116 - La Fiesta.mp3" },
      { name: "Colton Dixon - Up plus Up", file: "Colton Dixon - Up plus Up.mp3" },
      { name: "Flame - Let Go feat. DecemberRadio", file: "Flame - Let Go feat. DecemberRadio.mp3" },
      { name: "Flame - Surrender feat. V. Rose", file: "Flame - Surrender feat. V. Rose.mp3" },
      { name: "Flame - The 6th Day feat. Chris Cobbins", file: "Flame - The 6th Day feat. Chris Cobbins.mp3" },
      { name: "Forrest Frank - 2 STEP THE ENEMY", file: "Forrest Frank - 2 STEP THE ENEMY.mp3" },
      { name: "Forrest Frank - GOOD DAY", file: "Forrest Frank - GOOD DAY.mp3" },
      { name: "Forrest Frank - JESUS IS ALIVE feat. LOST FOUND", file: "Forrest Frank - JESUS IS ALIVE feat. LOST FOUND.mp3" },
      { name: "Forrest Frank - Jesus Paid It All Stripped", file: "Forrest Frank - Jesus Paid It All Stripped.mp3" },
      { name: "Forrest Frank - LEMONADE", file: "Forrest Frank - LEMONADE.mp3" },
      { name: "Forrest Frank - NO L s", file: "Forrest Frank - NO L s.mp3" },
      { name: "Forrest Frank - UP", file: "Forrest Frank - UP.mp3" },
      { name: "Forrest Frank - YOUR WAY S BETTER", file: "Forrest Frank - YOUR WAY S BETTER.mp3" },
      { name: "Josiah Queen - a life worth dying", file: "Josiah Queen - a life worth dying.mp3" },
      { name: "Josiah Queen - demons", file: "Josiah Queen - demons.mp3" },
      { name: "Josiah Queen - Dusty Bibles", file: "Josiah Queen - Dusty Bibles.mp3" },
      { name: "Josiah Queen - Empty as the Grave", file: "Josiah Queen - Empty as the Grave.mp3" },
      { name: "Josiah Queen - God of Miracles", file: "Josiah Queen - God of Miracles.mp3" },
      { name: "Josiah Queen - judas", file: "Josiah Queen - judas.mp3" },
      { name: "Josiah Queen - love you to death", file: "Josiah Queen - love you to death.mp3" },
      { name: "Josiah Queen - make heaven crowded", file: "Josiah Queen - make heaven crowded.mp3" },
      { name: "Josiah Queen - The Prodigal", file: "Josiah Queen - The Prodigal.mp3" },
      { name: "Josiah Queen - Thief In The Night", file: "Josiah Queen - Thief In The Night.mp3" },
      { name: "Lecrae - I'll Find You", file: "Lecrae - I ll Find You.mp3" },
      { name: "Lecrae - Your Power", file: "Lecrae - Your Power.mp3" },
      { name: "Lost Found - LOOK AT WHAT GOD HAS DONE", file: "Lost Found - LOOK AT WHAT GOD HAS DONE.mp3" },
      { name: "Lost Found - ONE DIRECTION GENESIS 50", file: "Lost Found - ONE DIRECTION GENESIS 50.mp3" },
      { name: "NF - HOPE", file: "NF - HOPE.mp3" },
      { name: "NF - RUNNING", file: "NF - RUNNING.mp3" },
      { name: "Peter Burton - Where Would I Be", file: "Peter Burton - Where Would I Be.mp3" },
      { name: "Phil Wickham - Able", file: "Phil Wickham - Able.mp3" },
      { name: "Phil Wickham - House of The Lord", file: "Phil Wickham - House of The Lord.mp3" },
      { name: "Phil Wickham - It Really Is Amazing Grace", file: "Phil Wickham - It Really Is Amazing Grace.mp3" },
      { name: "Phil Wickham - Praise The Lord Forever", file: "Phil Wickham - Praise The Lord Forever.mp3" },
      { name: "Phil Wickham - So So Good Live", file: "Phil Wickham - So So Good Live.mp3" },
      { name: "Phil Wickham - The Jesus Way", file: "Phil Wickham - The Jesus Way.mp3" },
      { name: "Phil Wickham - What An Awesome God", file: "Phil Wickham - What An Awesome God.mp3" },
      { name: "Phil Wickham - What If I Told You", file: "Phil Wickham - What If I Told You.mp3" },
      { name: "Phil Wickham - What An Awesome God (Sessions)", file: "Phil_Wickham_What_An_Awesome_God_Song_Sessions_with_Michael.mp3" },
      { name: "Seph Schlueter - Won't Start Now", file: "Seph Schlueter - Won t Start Now.mp3" },
      { name: "TobyMac - God Did It", file: "TobyMac - God Did It.mp3" },
      { name: "tobyMac - Til The Day I Die", file: "tobyMac - Til The Day I Die.mp3" }
    ];

    let currentTrackIndex = 0;

    const audio = document.getElementById('audio-player');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const currentTitle = document.getElementById('current-title');
    const currentStatus = document.getElementById('current-status');
    const artContainer = document.getElementById('art-container');
    const trackItems = document.querySelectorAll('.track-item');

    function loadTrack(index) {
      currentTrackIndex = index;
      audio.src = tracks[index].file;
      currentTitle.textContent = tracks[index].name;
      updatePlaylistUI();
    }

    function playAudio() {
      audio.play().catch(err => console.log("Bloqueo de autoplay:", err));
    }

    // Eventos del Reproductor
    audio.addEventListener('play', () => {
      currentStatus.textContent = 'Reproduciendo...';
      artContainer.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      currentStatus.textContent = 'Pausado';
      artContainer.classList.remove('playing');
    });

    // Secuencia Automática en Bucle
    audio.addEventListener('ended', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    // Controles Siguiente / Anterior
    btnNext.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    btnPrev.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    // Clic en elementos de la lista (si existieran)
    trackItems.forEach((item) => {
      item.addEventListener('click', () => {
        const idx = parseInt(item.getAttribute('data-index'));
        loadTrack(idx);
        playAudio();
      });
    });

    function updatePlaylistUI() {
      trackItems.forEach((item, idx) => {
        if (idx === currentTrackIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    // Inicializar pista 1
    loadTrack(0);
  </script>
</body>
</html>
