<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Playlist Personal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Reproductor Nativo HTML5 */
    .native-player-container {
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }

    /* Visualizador Banner */
    .album-art {
      width: 100%;
      height: 160px;
      background: linear-gradient(45deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
      position: relative;
      overflow: hidden;
    }

    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 40px;
    }

    .bar {
      width: 8px;
      background: #fff;
      border-radius: 4px;
      height: 10px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .bar:nth-child(2) { animation-delay: 0.3s; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 8px; }
      100% { height: 38px; }
    }

    .track-info {
      text-align: center;
      margin: 15px 0;
    }

    .track-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .track-status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Botones de Selección Directa */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="player-card">
    
    <!-- Reproductor Nativo Visible -->
    <div class="native-player-container">
      <audio id="audio-player" controls preload="auto">
        <source src="1.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
      </audio>
    </div>

    <!-- Visualizador de Estado -->
    <div class="album-art" id="art-container">
      <div class="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="current-title">Pista 1</div>
      <div class="track-status" id="current-status">Presiona Play en el reproductor</div>
    </div>

    <!-- Botones Anterior y Siguiente -->
    <div class="controls">
      <button class="btn" id="btn-prev">⏮️ Anterior</button>
      <button class="btn" id="btn-next">Siguiente ⏭️</button>
    </div>

  </div>

  <script>
    const tracks = [
      { name: "Pista 1", file: "1.mp3" },
      { name: "Pista 2", file: "2.mp3" },
      { name: "Pista 3", file: "3.mp3" },
      { name: "Pista 4", file: "4.mp3" },
      { name: "Pista 5", file: "5.mp3" },
      { name: "Pista 6", file: "6.mp3" },
      { name: "Pista 7", file: "7.mp3" },
      { name: "Pista 8", file: "8.mp3" },
      { name: "Pista 9", file: "9.mp3" },
      { name: "Pista 10", file: "10.mp3" },
      { name: "Pista 11", file: "11.mp3" },
      { name: "Pista 12", file: "12.mp3" },
      { name: "Pista 13", file: "13.mp3" },
      { name: "Pista 14", file: "14.mp3" },
      { name: "Pista 15", file: "15.mp3" },
      { name: "Pista 16", file: "16.mp3" },
      { name: "Pista 17", file: "17.mp3" },
      { name: "Pista 18", file: "18.mp3" },
      { name: "Pista 19", file: "19.mp3" },
      { name: "Pista 20", file: "20.mp3" },
      { name: "Pista 21", file: "21.mp3" },
      { name: "Pista 23", file: "23.mp3" },
      { name: "Pista 24", file: "24.mp3" },
      { name: "Pista 25", file: "25.mp3" },
      { name: "Pista 26", file: "26.mp3" },
      { name: "Pista 27", file: "27.mp3" },
      { name: "Pista 28", file: "28.mp3" },
      { name: "Pista 29", file: "29.mp3" },
      { name: "Pista 30", file: "30.mp3" },
      { name: "Pista 31", file: "31.mp3" },
      { name: "Pista 32", file: "32.mp3" },
      { name: "Pista 33", file: "33.mp3" },
      { name: "Pista 34", file: "34.mp3" },
      { name: "Pista 35", file: "35.mp3" },
      { name: "Pista 36", file: "36.mp3" },
      { name: "Pista 37", file: "37.mp3" },
      { name: "Pista 38", file: "38.mp3" },
      { name: "Pista 39", file: "39.mp3" },
      { name: "Pista 40", file: "40.mp3" },
      { name: "Pista 41", file: "41.mp3" },
      { name: "Pista 42", file: "42.mp3" },
      { name: "Pista 43", file: "43.mp3" },
      { name: "Pista 44", file: "44.mp3" },
      { name: "Pista 45", file: "45.mp3" },
      { name: "Pista 46", file: "46.mp3" },
      { name: "Pista 47", file: "47.mp3" },
      { name: "Pista 48", file: "48.mp3" },
      { name: "Pista 49", file: "49.mp3" },
      { name: "Pista 50", file: "50.mp3" },
      { name: "Pista 51", file: "51.mp3" },
      { name: "Pista 52", file: "52.mp3" },
      { name: "Pista 53", file: "53.mp3" }
    ];

    let currentTrackIndex = 0;

    const audio = document.getElementById('audio-player');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const currentTitle = document.getElementById('current-title');
    const currentStatus = document.getElementById('current-status');
    const artContainer = document.getElementById('art-container');
    const trackItems = document.querySelectorAll('.track-item');

    function loadTrack(index) {
      currentTrackIndex = index;
      audio.src = tracks[index].file;
      currentTitle.textContent = tracks[index].name;
      updatePlaylistUI();
    }

    function playAudio() {
      audio.play().catch(err => console.log("Bloqueo de autoplay:", err));
    }

    // Eventos del Reproductor
    audio.addEventListener('play', () => {
      currentStatus.textContent = 'Reproduciendo...';
      artContainer.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      currentStatus.textContent = 'Pausado';
      artContainer.classList.remove('playing');
    });

    // Secuencia Automática en Bucle (1 -> 2 -> ... -> 53 -> 1)
    audio.addEventListener('ended', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    // Controles Siguiente / Anterior
    btnNext.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    btnPrev.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    // Clic en elementos de la lista (por si se agrega alguno estático)
    trackItems.forEach((item) => {
      item.addEventListener('click', () => {
        const idx = parseInt(item.getAttribute('data-index'));
        loadTrack(idx);
        playAudio();
      });
    });

    function updatePlaylistUI() {
      trackItems.forEach((item, idx) => {
        if (idx === currentTrackIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    // Inicializar pista 1
    loadTrack(0);
  </script>
</body>
</html>
