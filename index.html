<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    p.subtitle {
      color: #b3c5d7;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .btn-main {
      display: inline-block;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
    }
    .hidden { display: none !important; }
    
    .track-display {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.2rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }
    .track-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #00c6ff;
      word-break: break-word;
      margin: 0 0 0.5rem 0;
      line-height: 1.4;
    }
    .track-status {
      font-size: 0.85rem;
      color: #88a0b5;
      margin: 0;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      flex: 1;
      transition: background 0.2s;
    }
    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .btn-play-pause {
      background: #0072ff;
      border: none;
    }
    .btn-play-pause:hover {
      background: #0052a3;
    }

    audio {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 8px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- ENTRADA -->
  <div id="welcome-card" class="card">
    <h1>MY PLAYLIST</h1>
    <p class="subtitle">Press enter to launch player</p>
    <button class="btn-main" onclick="entrar()">ENTER</button>
  </div>

  <!-- REPRODUCTOR -->
  <div id="player-card" class="card hidden">
    <h1>NOW PLAYING</h1>
    <p class="subtitle">Personal Media Player</p>
    
    <div class="track-display">
      <p class="track-title" id="current-title">---</p>
      <p class="track-status" id="track-counter">Track 0 of 0</p>
    </div>

    <!-- Reproductor nativo -->
    <audio id="audio-element" controls></audio>

    <!-- Botones de Control -->
    <div class="controls">
      <button class="btn-ctrl" onclick="anterior()">⏮️ Prev</button>
      <button class="btn-ctrl btn-play-pause" id="btn-toggle" onclick="alternarPlay()">⏸️ Pause</button>
      <button class="btn-ctrl" onclick="siguiente()">Next ⏭️</button>
    </div>

    <button onclick="salir()" class="btn-main btn-back">⬅️ Exit</button>
  </div>

  <script>
    // Lista exacta de tus archivos .mp3
    const canciones = [
      "01 Passion - One Thing Remains.mp3",
      "03 Casting Crowns - Just Be Held.mp3","05 NF - Wake Up.mp3",
      "07 NF - Oh Lord.mp3",
      "11 NF - I ll Keep On.mp3",
      "12 NF - Can You Hold Me.mp3",
      "13 Avicii - Trouble.mp3",
      "13 NF - I Miss The Days.mp3",
      "14 NF - Lost In The Moment.mp3",
      "15 Flame - Start Over (feat. NF).mp3",
      "116 - La Fiesta.mp3",
      "Colton Dixon - Up + Up.mp3",
      "Flame - Let Go (feat. DecemberRadio).mp3",
      "Flame - Surrender (feat. V. Rose).mp3",
      "Flame - The 6th Day (feat. Chris Coblins).mp3",
      "Forrest Frank - 2 STEP THE ENEMY.mp3",
      "Forrest Frank - GOOD DAY.mp3",
      "Forrest Frank - JESUS IS ALIVE (feat. LOST  FOUND).mp3",
      "Forrest Frank - Jesus Paid It All (Stripped).mp3",
      "Forrest Frank - LEMONADE.mp3",
      "Forrest Frank - NO L s (2).mp3",
      "Forrest Frank - UP! (4).mp3",
      "Forrest Frank - YOUR WAY S BETTER.mp3",
      "Josiah Queen - a life worth dying (2).mp3",
      "Josiah Queen - demons (2).mp3",
      "Josiah Queen - Dusty Bibles (2).mp3",
      "Josiah Queen - Empty as the Grave.mp3",
      "Josiah Queen - God of Miracles.mp3",
      "Josiah Queen - judas.mp3",
      "Josiah Queen - love you to death.mp3",
      "Josiah Queen - make heaven crowded.mp3",
      "Josiah Queen - The Prodigal (2).mp3",
      "Josiah Queen - Thief In The Night.mp3",
      "Lecrae - I ll Find You.mp3",
      "Lecrae - Your Power.mp3",
      "Lost  Found - LOOK AT WHAT GOD HAS DONE.mp3",
      "Lost  Found - ONE DIRECTION (GENESIS 50).mp3",
      "NF - HOPE.mp3",
      "NF - RUNNING.mp3",
      "Peter Burton - Where Would I Be.mp3",
      "Phil Wickham - Able.mp3",
      "Phil Wickham - House of The Lord.mp3",
      "Phil Wickham - It Really Is Amazing Grace.mp3",
      "Phil Wickham - Praise The Lord Forever.mp3",
      "Phil Wickham - So So Good (Live).mp3",
      "Phil Wickham - The Jesus Way.mp3",
      "Phil Wickham - What An Awesome God.mp3",
      "Phil Wickham - What If I Told You.mp3",
      "Phil_Wickham_What_An_Awesome_God_Song_Sessions_with_Michael.mp3",
      "Seph Schlueter - Won t Start Now.mp3",
      "TobyMac - God Did It.mp3",
      "tobyMac - Til The Day I Die.mp3"
    ];

    let currentIndex = 0;
    const audio = document.getElementById('audio-element');

    // Detección de la tecla ENTER
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        const welcomeCard = document.getElementById('welcome-card');
        if (!welcomeCard.classList.contains('hidden')) {
          entrar();
        }
      }
    });

    function obtenerNombreLimpio(nombreArchivo) {
      return nombreArchivo.replace(/\.[^/.]+$/, "");
    }

    function entrar() {
      if (canciones.length === 0) return;
      document.getElementById('welcome-card').classList.add('hidden');
      document.getElementById('player-card').classList.remove('hidden');
      currentIndex = 0;
      reproducirActual();
    }

    function reproducirActual() {
      const archivo = canciones[currentIndex];
      audio.src = archivo;
      
      document.getElementById('current-title').textContent = obtenerNombreLimpio(archivo);
      document.getElementById('track-counter').textContent = Track ${currentIndex + 1} of ${canciones.length};
      
      audio.play().catch(e => console.log("Autoplay bloqueado por el navegador:", e));
      document.getElementById('btn-toggle').textContent = '⏸️ Pause';
    }

    function alternarPlay() {
      if (audio.paused) {
        audio.play();
        document.getElementById('btn-toggle').textContent = '⏸️ Pause';
      } else {
        audio.pause();
        document.getElementById('btn-toggle').textContent = '▶️ Play';
      }
    }

    function siguiente() {
      currentIndex = (currentIndex + 1) % canciones.length;
      reproducirActual();
    }

    function anterior() {
      currentIndex = (currentIndex - 1 + canciones.length) % canciones.length;
      reproducirActual();
    }

    audio.onended = function() {
      siguiente();
    };

    function salir() {
      audio.pause();
      audio.src = '';
      document.getElementById('player-card').classList.add('hidden');
      document.getElementById('welcome-card').classList.remove('hidden');
    }
  </script>

</body>
</html>
