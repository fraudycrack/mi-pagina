<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Finanzas TCP / MIPYME</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #212529; }
    .nav-link { color: #adb5bd; }
    .nav-link.active { color: #fff; background-color: #0d6efd; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Menú Lateral -->
    <div class="col-md-3 col-lg-2 sidebar p-3 text-white">
      <h4 class="fs-5 text-center my-3"><i class="bi bi-calculator"></i> Finanzas Cuba</h4>
      <hr>
      <ul class="nav nav-pills flex-column mb-auto" id="mainTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active w-100 text-start" id="cuentas-tab" data-bs-toggle="pill" data-bs-target="#cuentas" type="button"><i class="bi bi-wallet2 me-2"></i>Cuentas</button>
        </li>
        <li class="nav-item">
          <button class="nav-link w-100 text-start" id="onat-tab" data-bs-toggle="pill" data-bs-target="#onat" type="button"><i class="bi bi-receipt me-2"></i>Tributos ONAT</button>
        </li>
        <li class="nav-item">
          <button class="nav-link w-100 text-start" id="usuarios-tab" data-bs-toggle="pill" data-bs-target="#usuarios" type="button"><i class="bi bi-people me-2"></i>Gestión Usuarios</button>
        </li>
      </ul>
    </div>

    <!-- Contenido de las Pestañas -->
    <div class="col-md-9 col-lg-10 p-4">
      <div class="tab-content" id="mainTabContent">
        
        <!-- Pestaña: Cuentas -->
        <div class="tab-pane fade show active" id="cuentas">
          <h2>Resumen de Cuentas</h2>
          <div class="row my-3">
            <div class="col-md-4">
              <div class="card text-bg-primary mb-3">
                <div class="card-body">
                  <h5 class="card-title">Chequera CUP</h5>
                  <p class="card-text fs-4" id="saldoChequera">$0.00 CUP</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card text-bg-success mb-3">
                <div class="card-body">
                  <h5 class="card-title">Tarjeta CUP</h5>
                  <p class="card-text fs-4" id="saldoTarjetaCUP">$0.00 CUP</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card text-bg-warning mb-3">
                <div class="card-body">
                  <h5 class="card-title">Tarjeta USD</h5>
                  <p class="card-text fs-4" id="saldoUSD">$0.00 USD</p>
                  <small class="text-dark">Tasa: 1 USD = 120 CUP</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Pestaña: ONAT -->
        <div class="tab-pane fade" id="onat">
          <h2>Cálculo de Impuestos ONAT</h2>
          <div class="card p-3 my-3">
            <div class="mb-3">
              <label for="inputIngresos" class="form-label">Ingresos Totales (CUP)</label>
              <input type="number" id="inputIngresos" class="form-control" value="100000">
            </div>
            <div class="mb-3">
              <label for="inputGastos" class="form-label">Gastos Deducibles (CUP)</label>
              <input type="number" id="inputGastos" class="form-control" value="40000">
            </div>
            <button class="btn btn-primary" onclick="calcularImpuestos()">Calcular Tributos</button>
            <div class="mt-3" id="resultadoOnat"></div>
          </div>
        </div>

        <!-- Pestaña: Usuarios (Módulo Corregido) -->
        <div class="tab-pane fade" id="usuarios">
          <h2>Gestión de Usuarios</h2>
          <div class="card p-3 mb-4"><h5>Crear Nuevo Usuario</h5>
            <form id="formUsuario">
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="inputUsuario" class="form-label">Usuario</label>
                  <input type="text" class="form-control" id="inputUsuario" placeholder="Ej: pedro" required>
                </div>
                <div class="col-md-4">
                  <label for="inputPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="inputPassword" placeholder="******" required>
                </div>
                <div class="col-md-4">
                  <label for="selectRol" class="form-label">Rol</label>
                  <select class="form-select" id="selectRol">
                    <option value="Admin">Administrador</option>
                    <option value="Editor">Editor</option>
                    <option value="Consultor" selected>Consultor</option>
                  </select>
                </div>
              </div>
              <button type="button" class="btn btn-success mt-3" id="btnCrearUsuario">
                <i class="bi bi-person-plus"></i> Crear Usuario
              </button>
            </form>
          </div>

          <div class="card p-3">
            <h5>Usuarios Registrados</h5>
            <table class="table table-striped mt-2">
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Rol</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tablaUsuarios">
                <!-- Se llena dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    inicializarEventosUsuarios();
    renderizarTablaUsuarios();
  });

  // Cálculo de tributos ONAT
  function calcularImpuestos() {
    const ingresos = parseFloat(document.getElementById('inputIngresos').value) || 0;
    const gastos = parseFloat(document.getElementById('inputGastos').value) || 0;
    
    const impVentas = ingresos * 0.10;
    const contribTerritorial = ingresos * 0.01;
    const utilidadNeta = ingresos - gastos;
    const impUtilidades = utilidadNeta > 0 ? utilidadNeta * 0.35 : 0;
    const totalTributos = impVentas + contribTerritorial + impUtilidades;

    document.getElementById('resultadoOnat').innerHTML = `
      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          10% Impuesto Ventas: <strong>$${impVentas.toFixed(2)} CUP</strong>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          1% Desarrollo Territorial: <strong>$${contribTerritorial.toFixed(2)} CUP</strong>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          35% Aporte Utilidades: <strong>$${impUtilidades.toFixed(2)} CUP</strong>
        </li>
        <li class="list-group-item list-group-item-dark d-flex justify-content-between align-items-center">
          Total Tributos: <strong>$${totalTributos.toFixed(2)} CUP</strong>
        </li>
      </ul>
    `;
  }

  // Lógica de Gestión de Usuarios
  function inicializarEventosUsuarios() {
    const btnCrear = document.getElementById('btnCrearUsuario');
    if (!btnCrear) return;

    btnCrear.addEventListener('click', function (e) {
      e.preventDefault();

      const inputUser = document.getElementById('inputUsuario');
      const inputPass = document.getElementById('inputPassword');
      const selectRol = document.getElementById('selectRol');

      const usuario = inputUser ? inputUser.value.trim() : '';
      const password = inputPass ? inputPass.value.trim() : '';
      const rol = selectRol ? selectRol.value : 'Consultor';

      if (!usuario || !password) {alert('Por favor, ingresa el usuario y la contraseña.');
        return;
      }

      let usuarios = JSON.parse(localStorage.getItem('app_usuarios')) || [];

      if (usuarios.some(u => u.usuario === usuario)) {
        alert('El nombre de usuario ya existe.');
        return;
      }

      usuarios.push({ usuario, password, rol });
      localStorage.setItem('app_usuarios', JSON.stringify(usuarios));

      inputUser.value = '';
      inputPass.value = '';

      alert('Usuario creado correctamente.');
      renderizarTablaUsuarios();
    });
  }

  function renderizarTablaUsuarios() {
    const tbody = document.getElementById('tablaUsuarios');
    if (!tbody) return;

    const usuarios = JSON.parse(localStorage.getItem('app_usuarios')) || [];
    tbody.innerHTML = '';

    if (usuarios.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No hay usuarios agregados.</td></tr>';
      return;
    }

    usuarios.forEach((u, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.usuario}</td>
        <td><span class="badge bg-secondary">${u.rol}</span></td>
        <td>
          <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuario(${index})">
            <i class="bi bi-trash"></i> Eliminar
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function eliminarUsuario(index) {
    let usuarios = JSON.parse(localStorage.getItem('app_usuarios')) || [];
    usuarios.splice(index, 1);
    localStorage.setItem('app_usuarios', JSON.stringify(usuarios));
    renderizarTablaUsuarios();
  }
</script>
</body>
</html>
