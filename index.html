<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Vault</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: #ffffff;
    }
    p.subtitle {
      color: #b3c5d7;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .btn-main {
      display: inline-block;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
    }
    .hidden { display: none !important; }
    .catalog-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.2rem;
      text-align: left;
    }
    .catalog-title {
      font-weight: 600;
      color: #fff;
      margin: 0 0 0.8rem 0;
      font-size: 1.1rem;
    }
    .controls-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-ctrl {
      flex: 1;
      padding: 0.6rem;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    audio {
      width: 100%;
      margin-top: 1rem;
      border-radius: 8px;
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      color: #ddd;
      margin-top: 1rem;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    #catalog-content {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 5px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BIENVENIDA -->
  <div id="welcome-card" class="card">
    <h1>MY PLAYLIST</h1>
    <p class="subtitle">Press enter to launch the audio player</p>
    <button class="btn-main" onclick="entrar()">ENTER</button>
  </div>

  <!-- REPRODUCTOR / CATÁLOGO -->
  <div id="catalog-card" class="card hidden">
    <h1>TRACKS</h1>
    <p class="subtitle">Select a track to play</p>
    
    <div id="catalog-content">
      <!-- Aquí se generan automáticamente las 52 canciones -->
    </div>

    <!-- Reproductor de Audio -->
    <audio id="audio-player" controls class="hidden"></audio>

    <button onclick="salir()" class="btn-main btn-back">⬅️ Exit</button>
  </div>

  <script>
    // Lista exacta de tus 52 canciones (omite el 22 que no está en la carpeta)
    const listaCanciones = [
      "1.mp3", "2.mp3", "3.mp3", "4.mp3", "5.mp3", "6.mp3", "7.mp3", "8.mp3", "9.mp3", "10.mp3",
      "11.mp3", "12.mp3", "13.mp3", "14.mp3", "15.mp3", "16.mp3", "17.mp3", "18.mp3", "19.mp3", "20.mp3",
      "21.mp3", "23.mp3", "24.mp3", "25.mp3", "26.mp3", "27.mp3", "28.mp3", "29.mp3", "30.mp3",
      "31.mp3", "32.mp3", "33.mp3", "34.mp3", "35.mp3", "36.mp3", "37.mp3", "38.mp3", "39.mp3", "40.mp3",
      "41.mp3", "42.mp3", "43.mp3", "44.mp3", "45.mp3", "46.mp3", "47.mp3", "48.mp3", "49.mp3", "50.mp3","51.mp3", "52.mp3", "53.mp3"
    ];

    let indiceActual = 0;

    function entrar() {
      document.getElementById('welcome-card').classList.add('hidden');
      document.getElementById('catalog-card').classList.remove('hidden');
    }

    // Generar la lista en la interfaz
    const contenedor = document.getElementById('catalog-content');
    listaCanciones.forEach((archivo, index) => {
      const box = document.createElement('div');
      box.className = 'catalog-box';
      box.innerHTML = `
        <p class="catalog-title">Track ${archivo.replace('.mp3', '')}</p>
        <button class="btn-main" onclick="reproducirIndice(${index})">▶️ Play Track</button>
        <div class="controls-group">
          <button class="btn-ctrl" onclick="anterior()">⏮️ Anterior</button>
          <button class="btn-ctrl" onclick="pausaPlay()">⏸️/▶️ Pausa</button>
          <button class="btn-ctrl" onclick="siguiente()">Siguiente ⏭️</button>
        </div>
      `;
      contenedor.appendChild(box);
    });

    function reproducirIndice(index) {
      indiceActual = index;
      const player = document.getElementById('audio-player');
      player.src = listaCanciones[indiceActual];
      player.classList.remove('hidden');
      player.play();
    }

    function pausaPlay() {
      const player = document.getElementById('audio-player');
      if (!player.src) return;
      if (player.paused) {
        player.play();
      } else {
        player.pause();
      }
    }

    function siguiente() {
      indiceActual = (indiceActual + 1) % listaCanciones.length;
      reproducirIndice(indiceActual);
    }

    function anterior() {
      indiceActual = (indiceActual - 1 + listaCanciones.length) % listaCanciones.length;
      reproducirIndice(indiceActual);
    }

    function salir() {
      const player = document.getElementById('audio-player');
      player.pause();
      player.src = '';
      player.classList.add('hidden');

      document.getElementById('catalog-card').classList.add('hidden');
      document.getElementById('welcome-card').classList.remove('hidden');
    }
  </script>

</body>
</html>
